name: Technical English Normalization Runner

# Manual, read-only tool. It never commits or pushes: a maintainer downloads the
# generated patch, reviews it and applies it through the guarded local workflow
# (dev is the only branch; docs/engineering/git-safety.md). It is intentionally
# NOT triggered by commit messages.
on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Cluster to normalize (the runner authorizes only this one)"
        required: true
        type: choice
        options:
          - artist

permissions:
  contents: read

concurrency:
  group: technical-english-normalization
  cancel-in-progress: false

jobs:
  normalize:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the dispatching dev head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute deterministic normalization
        env:
          CLUSTER: ${{ inputs.cluster }}
        run: node scripts/run-technical-english-normalization.mjs "$CLUSTER"

      - name: Verify protected Engineering OS paths are untouched
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .claude .gitignore; then
            echo 'Protected Engineering OS paths were modified.' >&2
            git diff -- .claude .gitignore
            exit 1
          fi

      - name: Validate working-tree patch
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Run web typecheck after normalization
        run: pnpm --filter @music-os-360/web typecheck

      - name: Run web regression tests after normalization
        run: pnpm --filter @music-os-360/web test:run

      - name: Export the patch (no commit, no push)
        shell: bash
        run: |
          set -euo pipefail
          git diff -- apps/web/src > normalization.patch
          test -s normalization.patch || { echo 'No normalization changes.' >&2; exit 1; }

      - name: Upload the patch for maintainer review
        uses: actions/upload-artifact@v4
        with:
          name: technical-english-normalization-patch
          path: normalization.patch
          retention-days: 14
