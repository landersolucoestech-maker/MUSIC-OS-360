# STEP 12-J.7 — observability + WEB overlay for staging.
# Usage (on top of the base compose, which already has postgres/redis/api):
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Provides: WEB (Vite preview), Prometheus (scrapes the API /metrics) and Grafana
# (Prometheus + Postgres datasources already provisioned + RBAC shadow dashboard).
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api/v1}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_AUTH_DISABLED: ${VITE_AUTH_DISABLED:-false}
    container_name: musicos360_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '5000:5000'

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: musicos360_prometheus
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:11.2.0
    container_name: musicos360_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # injected into the datasources (see provisioning); local postgres is optional
      # (--profile local-db) — without it the Grafana Postgres datasource is
      # unreachable, but that does not block Grafana itself from starting.
      MUSICOS_DB_HOST: postgres
      MUSICOS_DB_NAME: ${POSTGRES_DB:-musicos360}
      MUSICOS_DB_USER: ${POSTGRES_USER:-musicos360}
      MUSICOS_DB_PASSWORD: ${POSTGRES_PASSWORD:-musicos360_dev}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3000:3000'

volumes:
  prometheus_data:
    name: musicos360_prometheus_data
  grafana_data:
    name: musicos360_grafana_data
