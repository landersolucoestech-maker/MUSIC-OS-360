# STEP 12-J.7 — Prometheus scrape config for the MUSIC OS 360 API.
# The API exposes metrics at GET /metrics (Prometheus text/plain).
# If METRICS_TOKEN is defined in the API, configure the bearer_token below.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'musicos360-api'
    metrics_path: /metrics
    # bearer_token: '<METRICS_TOKEN>'   # descomente se a API exigir token
    static_configs:
      - targets: ['api:3001']
        labels:
          service: 'api'
          env: 'staging'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
