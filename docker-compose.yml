version: '3.9'

# ─── MUSIC OS 360 — Local Development Stack ──────────────────────────────────
# Services: PostgreSQL + Redis + NestJS API
# The frontend (Vite) runs locally via `npm run dev:web` — not containerized.
#
# Usage (explicit --env-file — Docker Compose no longer discovers an implicit
# `.env` at the root; the canonical name is now .env.development):
#   docker compose --env-file .env.development up -d          # start every service in the background
#   docker compose --env-file .env.development logs -f api    # follow the API logs
#   docker compose --env-file .env.development down -v        # stop and remove volumes
#
# Environment variables: edit .env.development directly (a real file, kept
# out of Git — no longer a .example template to copy).

services:
  # ─── PostgreSQL (local, OPTIONAL) ─────────────────────────────────────────────
  # Not required to run the application: in development, apps/api connects
  # directly to the remote Supabase DEV Postgres via DATABASE_URL
  # (.env.development). This service only starts with `--profile local-db`, for
  # anyone who wants an isolated local Postgres (e.g. offline tests without Supabase).
  postgres:
    profiles: ['local-db']
    image: postgres:16-alpine
    container_name: musicos360_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musicos360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-musicos360}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U musicos360']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: musicos360_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: musicos360_api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in local .env}
      DB_SSL: ${DB_SSL:-false}
      REDIS_QUEUE_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379
      RBAC_PERSISTED_AUTHORITY: SHADOW
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      # Fill in with real values (or use .env):
      SUPABASE_URL: ${SUPABASE_URL:-https://placeholder.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in local .env}
      CORS_ORIGINS: http://localhost:5000
    ports:
      - '3001:3001'
    volumes:
      - api_logs:/app/apps/api/logs
    healthcheck:
      # NOTE: distroless image has no shell/wget. Use TCP probe via /nodejs/bin/node.
      test: ['CMD', '/nodejs/bin/node', '-e', "require('http').get('http://localhost:3001/api/v1/health/live', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
    name: musicos360_postgres_data
  redis_data:
    name: musicos360_redis_data
  api_logs:
    name: musicos360_api_logs
